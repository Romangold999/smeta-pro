<head>

<style>
:root{--bg:#0b1220;--panel:#172338;--blue:#64d7ff;--muted:#9aaac0;--tile-blue:#183d5b;--tile-green:#17483f;--tile-orange:#53351f;--tile-purple:#382b5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;padding:0 16px 92px}.top{display:flex;align-items:center;padding:18px 0}.brand{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:2px}.heading{font-size:24px;font-weight:800;margin-top:2px}.addtop{margin-left:auto;border:0;background:transparent;color:var(--blue);font-size:30px;width:42px;height:42px}.section-label{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1.5px;margin:12px 0 10px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;text-align:left;color:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-height:142px}.tile .ico{font-size:30px;font-weight:800}.tile strong{font-size:18px}.tile small{color:var(--muted);font-size:13px;margin-top:4px}.tile.green{background:var(--tile-green);min-height:118px}.tile.orange{background:var(--tile-orange);min-height:118px}.tile.purple{background:var(--tile-purple);min-height:118px}.tile.blue{background:var(--tile-blue)}.card{background:var(--panel);border-radius:18px;padding:14px;margin-top:8px}.current{display:flex;justify-content:space-between;align-items:end;gap:10px}.current strong{font-size:18px}.total{font-size:22px;color:var(--blue);font-weight:900;white-space:nowrap}.btn{border:0;border-radius:14px;background:#64d7ff;color:#0b1220;font-weight:750;padding:12px 14px}.btn.outline{background:transparent;color:var(--blue);border:1px solid #42617c}.btn.full{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}.stat{background:var(--panel);border-radius:14px;padding:14px}.stat label{display:block;color:var(--muted);font-size:10px;font-weight:700}.stat strong{font-size:23px}.stat .total{font-size:23px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.actions button{padding:10px 4px;font-size:13px}.search{width:100%;padding:13px;border:1px solid #40536b;border-radius:12px;background:var(--panel);color:white;outline:none}.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.tabs button{white-space:nowrap;border:0;border-radius:20px;padding:8px 12px;background:var(--panel);color:var(--muted);font-size:13px}.tabs button.active{background:var(--tile-blue);color:var(--blue)}.muted{color:var(--muted)}.small{font-size:11px}.work,.project,.version{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:12px;margin:7px 0}.work-main,.grow{flex:1;min-width:0}.work-name{font-size:14px;font-weight:600;overflow-wrap:anywhere}.price{color:var(--blue);font-weight:800;text-align:right;white-space:nowrap}.line{background:var(--panel);border-radius:14px;padding:13px;margin:8px 0}.line-head{display:flex;align-items:flex-start;gap:8px}.line-head strong{flex:1;font-size:14px}.iconbtn{border:0;background:transparent;color:var(--blue);font-size:19px;padding:3px}.danger{color:#ff6464}.line-foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px}.empty{display:grid;place-items:center;min-height:45vh;color:var(--muted);text-align:center}.nav{position:fixed;bottom:0;left:0;right:0;background:#111c2d;display:flex;justify-content:center;padding:8px max(6px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));z-index:5}.nav-inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:5px 0}.nav button span{display:block;font-size:20px;margin-bottom:3px}.nav button.active{color:var(--blue)}.nav button.active span{background:var(--tile-blue);border-radius:12px;display:inline-block;padding:2px 16px}.modal-back{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(760px,100%);max-height:90dvh;overflow:auto;background:#172338;border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom))}.modal h3{margin:0 0 14px;font-size:19px}.field{display:block;width:100%;margin:9px 0;padding:12px;border:1px solid #52647b;border-radius:10px;background:#0b1220;color:white}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.check{display:flex;align-items:center;gap:8px;margin-top:10px}.page{display:none}.page.active{display:block}.pricehead{display:flex;align-items:center;gap:8px}.pricehead strong{flex:1}.version.active{outline:1px solid #64d7ff}
</style></head>
<body><main class="app">
<header class="top"><div><div class="brand">СМЕТА PRO</div><div class="heading" id="heading">Работаем удобно</div></div><button class="addtop" id="topAdd" aria-label="Добавить">＋</button></header>
<section class="page active" id="page-home">
<div class="section-label">БЫСТРЫЙ ДОСТУП</div>
<div class="tiles"><button class="tile blue" data-go="Смета"><span class="ico">₽</span><span><strong>Моя смета</strong><br><small id="homeTotal" style="color:var(--blue)">0 ₽</small></span></button><button class="tile" style="background:var(--tile-green)" data-go="Прайс"><span class="ico" style="color:#75e0b1">▤</span><span><strong>Прайс работ</strong><br><small id="homeCount">0 позиций</small></span></button><button class="tile orange" data-go="Проекты"><span class="ico" style="color:#ffc078">▣</span><span><strong>Проекты</strong><br><small id="projectCount">1 сохранено</small></span></button><button class="tile purple" data-go="Настройки"><span class="ico" style="color:#c5aeff">⚙</span><span><strong>Настройки</strong><br><small>Цены и версии прайса</small></span></button></div>
<div class="section-label" style="margin-top:18px">ТЕКУЩИЙ ПРОЕКТ</div><div class="card current" id="homeProject"></div><button class="btn full" id="newEstimate">＋ Новая смета / работа</button>
</section>
<section class="page" id="page-estimate"><div class="stats"><div class="stat"><label>ПОЗИЦИЙ</label><strong id="lineCount">0</strong></div><div class="stat"><label>ИТОГО</label><strong class="total" id="estimateTotal">0 ₽</strong></div></div><div class="actions"><button class="btn outline" id="pdfBtn">▧ PDF</button><button class="btn outline" id="excelBtn">Excel</button><button class="btn outline" id="shareBtn">↗ Текст</button></div><button class="btn full" id="addWork">＋ Добавить работу</button><div id="estimateLines"></div></section>
<section class="page" id="page-price"><input class="search" id="search" placeholder="Поиск работы"><div class="tabs" id="categoryTabs"></div><div class="muted small" id="filteredCount"></div><div id="workList"></div></section>
<section class="page" id="page-projects"><button class="btn full" id="createProject">＋ Создать смету</button><div id="projectsList"></div></section>
<section class="page" id="page-settings"><strong style="font-size:18px">Управление прайсом</strong><div class="muted" id="activePriceLabel" style="margin:8px 0">Активный прайс</div><button class="btn full" id="newPriceVersion">＋ Создать новую версию прайса</button><div style="font-weight:700;margin:16px 0 6px">Версии прайса</div><div id="versionsList"></div><div class="pricehead" style="margin:14px 0 6px"><strong>Позиции активного прайса</strong><button class="iconbtn" id="addPriceItem">＋ Добавить</button></div><div id="settingsWorkList"></div></section>
</main>
<nav class="nav"><div class="nav-inner"><button data-page="Главная" class="active"><span>⌂</span>Главная</button><button data-page="Смета"><span>₽</span>Смета</button><button data-page="Прайс"><span>▤</span>Прайс</button><button data-page="Проекты"><span>▣</span>Проекты</button><button data-page="Настройки"><span>⚙</span>Настройки</button></div></nav>
<div id="modalRoot"></div>
<script>
const catalog=[
["Укладка керамогранита 60×60, 60×20, 120×20",2000,"м²","Плитка",false],["Укладка КГ 120×60, 80×80",2300,"м²","Плитка",false],["Укладка керамогранита 160×80",3000,"м²","Плитка",false],["Мозаика",3000,"м²","Плитка",true],
["Штукатурка ЦПС до 3 см",750,"м²","Подготовка",false],["Контактный слой плиточным клеем",200,"м²","Подготовка",false],["Грунтование",100,"м²","Подготовка",false],["Поддон в строительном исполнении",40000,"шт","Сантехника",true],["Гидроизоляция (2 слоя)",350,"м²","Подготовка",false],["Гидроизоляционная лента",200,"м.п.","Подготовка",false],["Стяжка до 3 см",750,"м²","Подготовка",false],
["Короб инсталляции ГКЛ",4500,"шт","ГКЛ",false],["ГКЛ короб до 30 см",1300,"м.п.","ГКЛ",false],["ГКЛ экран под ванну",2000,"шт","ГКЛ",true],["Облицовка керамогранитом погонаж до 40 см",1500,"м.п.","Плитка",false],["Отверстия в керамограните до 70 мм",500,"шт","Плитка",false],["Отверстия в керамограните более 70 мм",650,"шт","Плитка",false],["Запил керамогранита 45°",1500,"м.п.","Плитка",false],["Г-образная подрезка",800,"м.п.","Плитка",false],["Заводской рез",500,"м.п.","Плитка",false],
["Установка потайного люка с облицовкой (до 60×60 см)",4000,"шт","Монтаж",false],["Установка ревизионного люка на магнитах",3000,"шт","Монтаж",false],["Установка светильника",800,"шт","Электрика",false],["Установка вентилятора",1000,"шт","Электрика",false],
["Установка, сборка, подключение ванны (акрил, металл)",4500,"шт","Сантехника",false],["Установка, сборка чугунной ванны",6000,"шт","Сантехника",false],["Сборка, установка стеклянной ширмы душевой кабины",6000,"шт","Сантехника",true],["Установка унитаза",2500,"шт","Сантехника",false],["Установка умывальника",1700,"шт","Сантехника",false],["Установка бойлера",2500,"шт","Сантехника",false],["Установка полотенцесушителя",3000,"шт","Сантехника",false],["Установка, подключение инсталляции",4500,"шт","Сантехника",false],["Установка унитаза инсталляции",2500,"шт","Сантехника",false],["Установка кнопки инсталляции",500,"шт","Сантехника",false],
["Установка зеркала",1300,"шт","Монтаж",false],["Установка зеркала с подсветкой",1500,"шт","Электрика",false],["Установка аксессуаров",800,"шт","Монтаж",false],["Установка смесителя",1800,"шт","Сантехника",false],["Установка крана умывальника",800,"шт","Сантехника",false],["Установка тумбы умывальника",1700,"шт","Сантехника",false],["Установка встраиваемого смесителя",3500,"шт","Сантехника",false],["Установка гигиенического душа",1400,"шт","Сантехника",false],["Установка встраиваемого гигиенического душа",3500,"шт","Сантехника",false],["Установка смесителя + штанга",3000,"шт","Сантехника",false],["Установка системы тропический душ",3500,"шт","Сантехника",false],
["Распайка ПП трубы (1 точка)",2000,"точка","Сантехника",false],["Канализация",2000,"точка","Сантехника",false],["Установка водомера",800,"шт","Сантехника",false],["Штроба в бетоне 20 мм",1000,"м.п.","Электрика",false],["Штроба в бетоне 50 мм",1500,"м.п.","Электрика",false],["Штроба в газоблоке 20 мм",700,"м.п.","Электрика",false],["Заделка штробы",200,"м.п.","Подготовка",false],["Отверстие в бетоне для подрозетника",400,"шт","Электрика",false],["Монтаж подрозетника",100,"шт","Электрика",false],["Установка розетки",250,"шт","Электрика",false],["Демонтаж старой штукатурки",450,"м²","Демонтаж",false],["Демонтаж плитки",1000,"м²","Демонтаж",false],["Изготовление раковины из керамогранита (до 80 см)",25000,"шт","Сантехника",false],["Монтаж раковины",7000,"шт","Сантехника",true]
].map(([n,p,u,c,from],i)=>({id:"w"+i,n,p,u,c,from}));
const categories=["Все","Плитка","Сантехника","Электрика","Подготовка","ГКЛ","Демонтаж","Монтаж"];
const money=n=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Number(n)||0)+" ₽";
const uid=()=>Date.now()+Math.floor(Math.random()*10000);
// Данные существуют только в памяти текущего сеанса. Никакого сохранения в браузере или на сервере.
let projects=[{id:uid(),name:"Новая смета",lines:[]}];
let currentId=projects[0].id,filter="Все",query="",page="Главная";
let versions=[{id:uid(),title:"Базовый прайс",createdAt:Date.now(),items:catalog}];
let activePriceId=versions[0].id;
const project=()=>projects.find(p=>p.id===currentId)||projects[0];
const activePrice=()=>versions.find(v=>v.id===activePriceId)||versions[0];
const total=p=>p.lines.reduce((s,l)=>s+(Number(l.p)||0)*(Number(l.q)||0),0);
function save(){}
function go(p){page=p;document.getElementById("topAdd").style.display=(p==="Главная"||p==="Смета")?"block":"none";document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id==="page-"+({Главная:"home",Смета:"estimate",Прайс:"price",Проекты:"projects",Настройки:"settings"}[p])));document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));document.getElementById("heading").textContent=({Главная:"Работаем удобно",Смета:project().name,Прайс:"Каталог работ",Проекты:"Мои проекты",Настройки:"Настройки"})[p];render()}
function render(){save();const p=project();document.getElementById("homeTotal").textContent=money(total(p));document.getElementById("homeCount").textContent=activePrice().items.length+" позиций";document.getElementById("projectCount").textContent=projects.length+" сохранено";document.getElementById("homeProject").innerHTML='<div><strong>'+esc(p.name)+'</strong><div class="muted small" style="margin-top:8px">'+p.lines.length+' позиций</div></div><div class="total">'+money(total(p))+'</div>';document.getElementById("lineCount").textContent=p.lines.length;document.getElementById("estimateTotal").textContent=money(total(p));
document.getElementById("estimateLines").innerHTML=p.lines.length?p.lines.map((l,i)=>'<div class="line"><div class="line-head"><strong>'+esc(l.n)+'</strong><button class="iconbtn" onclick="editLine('+i+')">✎</button><button class="iconbtn danger" onclick="removeLine('+i+')">⌫</button></div><div class="line-foot"><span class="muted">'+money(l.p)+' / '+esc(l.u)+' × '+l.q+'</span><b style="color:var(--blue)">'+money(l.p*l.q)+'</b></div></div>').join(""):'<div class="empty">Смета пуста — добавьте работу из прайса</div>';
document.getElementById("categoryTabs").innerHTML=categories.map(c=>'<button class="'+(filter===c?"active":"")+'" onclick="setFilter(\''+c+'\')">'+c+'</button>').join("");const filtered=activePrice().items.filter(w=>(filter==="Все"||w.c===filter)&&w.n.toLowerCase().includes(query.toLowerCase()));document.getElementById("filteredCount").textContent=filtered.length+" работ";document.getElementById("workList").innerHTML=filtered.map(w=>'<div class="work" onclick="addFromPrice(\''+w.id+'\')"><div class="work-main"><div class="work-name">'+esc(w.n)+'</div><div class="muted small">'+esc(w.c)+'</div></div><div class="price">'+money(w.p)+(w.from?" от":"")+'<div class="muted small" style="font-weight:400">за '+esc(w.u)+'</div></div></div>').join("")||'<div class="empty">Работы не найдены</div>';
document.getElementById("projectsList").innerHTML=projects.map(pr=>'<div class="project"><div class="grow" onclick="currentId='+pr.id+';go(\'Смета\')"><b>'+esc(pr.name)+'</b><div class="muted small">'+pr.lines.length+' позиций</div></div><div class="price">'+money(total(pr))+'<div><button class="iconbtn danger" onclick="deleteProject('+pr.id+')">⌫</button></div></div></div>').join("");
document.getElementById("activePriceLabel").textContent="Активный прайс: "+activePrice().title;document.getElementById("versionsList").innerHTML=versions.map(v=>'<div class="version '+(v.id===activePriceId?"active":"")+'"><div class="grow"><b>'+esc(v.title)+'</b><div class="muted small">'+v.items.length+' позиций</div></div>'+(v.id===activePriceId?'<span class="price small">АКТИВЕН</span>':'<button class="iconbtn" onclick="chooseVersion('+v.id+')">Выбрать</button>')+'</div>').join("");document.getElementById("settingsWorkList").innerHTML=activePrice().items.map(w=>'<div class="work" onclick="editPrice(\''+w.id+'\')"><div class="work-main"><div class="work-name">'+esc(w.n)+'</div><div class="muted small">'+esc(w.c)+' · '+esc(w.u)+'</div></div><div class="price">'+money(w.p)+(w.from?" от":"")+'<div class="muted small" style="font-weight:400">Изменить</div></div></div>').join("")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setFilter(c){filter=c;render()}function addFromPrice(id){const w=activePrice().items.find(x=>x.id===id);if(!w)return;project().lines.push({n:w.n,p:w.p,q:1,u:w.u,from:w.from});save();go("Смета")}
function removeLine(i){project().lines.splice(i,1);render()}function deleteProject(id){if(projects.length===1){alert("Нельзя удалить последний проект.");return}if(!confirm("Удалить проект и его смету без возможности восстановления?"))return;projects=projects.filter(p=>p.id!==id);if(currentId===id)currentId=projects[0].id;render()}
function modal(title,body,submitLabel,submit){const root=document.getElementById("modalRoot");root.innerHTML='<div class="modal-back" id="backdrop"><div class="modal"><h3>'+title+'</h3>'+body+'<div class="modal-actions"><button class="btn outline" id="cancelModal">Отмена</button><button class="btn" id="submitModal">'+submitLabel+'</button></div></div></div>';root.querySelector("#cancelModal").onclick=()=>root.innerHTML="";root.querySelector("#backdrop").onclick=e=>{if(e.target.id==="backdrop")root.innerHTML=""};root.querySelector("#submitModal").onclick=()=>{if(submit()!==false)root.innerHTML=""}}
function input(id,label,value,type="text"){return '<label class="muted small">'+label+'</label><input class="field" id="'+id+'" type="'+type+'" value="'+esc(value)+'">'}
function newProject(){modal("Новая смета",input("projectName","Название новой сметы",""),"Сохранить",()=>{let n=document.getElementById("projectName").value.trim();if(!n)return false;const p={id:uid(),name:n,lines:[]};projects.push(p);currentId=p.id;go("Смета")})}
function newCustom(){modal("Новая смета / работа",input("projectName","Название новой сметы","")+input("customName","Или название работы","")+input("customPrice","Цена","0","number")+input("customUnit","Единица","шт"),"Сохранить",()=>{const n=document.getElementById("projectName").value.trim(),wn=document.getElementById("customName").value.trim(),price=Number(document.getElementById("customPrice").value)||0,u=document.getElementById("customUnit").value.trim()||"шт";if(n){const p={id:uid(),name:n,lines:[]};projects.push(p);currentId=p.id}else if(wn){project().lines.push({n:wn,p:price,q:1,u});if(!activePrice().items.some(w=>w.n.toLowerCase()===wn.toLowerCase())){activePrice().items.push({id:"w"+uid(),n:wn,p:price,u,c:"Пользовательские",from:false})}}else return false;go(page)})}
function editLine(i){const l=project().lines[i];modal("Редактировать",'<div>'+esc(l.n)+'</div>'+input("linePrice","Цена",l.p,"number")+input("lineQty","Количество",l.q,"number"),"Сохранить",()=>{l.p=Number(document.getElementById("linePrice").value)||0;l.q=Number(document.getElementById("lineQty").value)||0;render()})}
function priceForm(w){modal(w?"Изменить позицию прайса":"Новая работа",input("wName","Название",w?.n||"")+input("wPrice","Цена",w?.p??0,"number")+input("wUnit","Единица измерения",w?.u||"шт")+input("wCat","Категория",w?.c||"Монтаж")+'<label class="check"><input id="wFrom" type="checkbox" '+(w?.from?"checked":"")+'> Цена «от»</label>',"Сохранить",()=>{let n=document.getElementById("wName").value.trim(),p=Number(document.getElementById("wPrice").value),u=document.getElementById("wUnit").value.trim(),c=document.getElementById("wCat").value.trim();if(!n||!Number.isFinite(p)||p<0||!u||!c)return false;let item={id:w?.id||"w"+uid(),n,p,u,c,from:document.getElementById("wFrom").checked};let ix=activePrice().items.findIndex(x=>x.id===w?.id);if(ix>=0)activePrice().items[ix]=item;else activePrice().items.push(item);render()})}
function editPrice(id){priceForm(activePrice().items.find(w=>w.id===id))}function chooseVersion(id){activePriceId=id;render()}
function makeVersion(){const now=Date.now(),d=new Date(now).toLocaleDateString("ru-RU");versions.unshift({id:now,title:"Прайс от "+d,createdAt:now,items:JSON.parse(JSON.stringify(activePrice().items))});activePriceId=now;render()}
async function deliverFile(blob,name){const file=new File([blob],name,{type:blob.type||"application/octet-stream"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function exportText(){const p=project();let out=p.name+"\n";p.lines.forEach(l=>out+=l.n+" | "+l.q+" "+l.u+" × "+money(l.p)+" = "+money(l.p*l.q)+"\n");out+="ИТОГО: "+money(total(p));await deliverFile(new Blob(["\\ufeff"+out],{type:"text/plain;charset=utf-8"}),"Smeta-"+p.id+".txt")}
async function exportExcel(){const p=project();if(!window.XLSX){alert("Не удалось загрузить модуль Excel. Проверьте интернет.");return}const rows=[["Смета",p.name],["Работа","Количество","Ед.","Цена, руб.","Сумма, руб."],...p.lines.map(l=>[l.n,l.q,l.u,l.p,l.p*l.q]),["ИТОГО","","","",total(p)]];const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Смета");const data=XLSX.write(wb,{bookType:"xlsx",type:"array"});await deliverFile(new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"Smeta-"+p.id+".xlsx")}
async function exportPdf(){const p=project();if(!p.lines.length){alert("Смета пока пустая");return}if(!window.html2pdf){alert("Не удалось загрузить модуль PDF. Проверьте интернет.");return}const el=document.createElement("div");el.style.cssText="font-family:Arial,sans-serif;color:#222;background:#fff;padding:28px;width:794px";el.innerHTML='<h1 style="font-size:22px">СМЕТА PRO</h1><h2 style="font-size:17px;font-weight:400">'+esc(p.name)+'</h2><table style="width:100%;border-collapse:collapse;margin-top:24px"><thead><tr><th style="text-align:left;border-bottom:1px solid #bbb;padding:8px">Работа</th><th style="text-align:right;border-bottom:1px solid #bbb;padding:8px">Кол-во</th><th style="text-align:right;border-bottom:1px solid #bbb;padding:8px">Цена</th><th style="text-align:right;border-bottom:1px solid #bbb;padding:8px">Сумма</th></tr></thead><tbody>'+p.lines.map(l=>'<tr><td style="border-bottom:1px solid #ddd;padding:8px">'+esc(l.n)+'</td><td style="text-align:right;border-bottom:1px solid #ddd;padding:8px">'+l.q+' '+esc(l.u)+'</td><td style="text-align:right;border-bottom:1px solid #ddd;padding:8px">'+money(l.p)+'</td><td style="text-align:right;border-bottom:1px solid #ddd;padding:8px">'+money(l.p*l.q)+'</td></tr>').join("")+'</tbody></table><h2 style="text-align:right;margin-top:28px">ИТОГО: '+money(total(p))+'</h2>';document.body.appendChild(el);try{const blob=await window.html2pdf().set({margin:10,image:{type:"jpeg",quality:0.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["avoid-all","css","legacy"]}}).from(el).outputPdf("blob");el.remove();await deliverFile(blob,"Smeta-"+p.id+".pdf")}catch(e){el.remove();alert("Не удалось сформировать PDF: "+(e?.message||"ошибка"))}}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
document.getElementById("topAdd").onclick=()=>newCustom();document.getElementById("newEstimate").onclick=newCustom;document.getElementById("createProject").onclick=newProject;document.getElementById("addWork").onclick=()=>go("Прайс");document.getElementById("addPriceItem").onclick=()=>priceForm(null);document.getElementById("newPriceVersion").onclick=makeVersion;document.getElementById("pdfBtn").onclick=exportPdf;document.getElementById("excelBtn").onclick=exportExcel;document.getElementById("shareBtn").onclick=exportText;document.getElementById("search").oninput=e=>{query=e.target.value;render()};
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#0b1220");tg.setBackgroundColor("#0b1220")}catch{}}
render();
</script></body></html>
