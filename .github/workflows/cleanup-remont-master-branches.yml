name: Remove obsolete RemontMaster branches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-remont-master-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only obsolete RemontMaster branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            remont-master-admin-cloudflare \
            remont-master-admin-git \
            remont-master-admin-rebuild \
            remont-master-backend \
            remont-master-pdf-max \
            remont-master-pdf-max-v2 \
            remont-master-ui-work
          do
            if gh api "repos/$REPOSITORY/branches/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
              echo "DELETED: $branch"
            else
              echo "ALREADY ABSENT: $branch"
            fi
          done
