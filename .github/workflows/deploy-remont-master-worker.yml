name: Deploy RemontMaster Cloudflare Worker
on:
  push:
    branches: [remont-master-admin-cloudflare]
    paths:
      - "remont-master-backend/**"
      - ".github/workflows/deploy-remont-master-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Check Cloudflare credentials and resources
        working-directory: remont-master-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          npx wrangler d1 list
      - name: Apply D1 migrations
        working-directory: remont-master-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply remont-master-db --remote
      - name: Verify D1 schema and seed data
        working-directory: remont-master-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute remont-master-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('site_content','work_catalog','leads','media','lead_rate_limits') ORDER BY name"
          npx wrangler d1 execute remont-master-db --remote --command "SELECT COUNT(*) AS catalog_items FROM work_catalog"
          npx wrangler d1 execute remont-master-db --remote --command "SELECT COUNT(*) AS content_records FROM site_content"
      - name: Configure Worker secrets
        working-directory: remont-master-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.REMONT_MASTER_ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.REMONT_MASTER_SESSION_SECRET }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ] || [ -z "$SESSION_SECRET" ]; then
            echo "::error::Admin secrets are required for the admin panel smoke test."
            exit 1
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
      - name: Deploy Worker and static admin fallback
        working-directory: remont-master-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test live API and admin authentication
        env:
          ADMIN_PASSWORD: ${{ secrets.REMONT_MASTER_ADMIN_PASSWORD }}
          BASE_URL: https://remont-master-backend.romarutyunov.workers.dev
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/api/health" | jq -e '.ok == true and .service == "remont-master-backend"' >/dev/null
          curl -fsS "$BASE_URL/api/catalog" | jq -e '.items | length == 317' >/dev/null
          curl -fsS "$BASE_URL/api/content" | jq -e '.content | type == "object"' >/dev/null
          LOGIN_JSON="$(curl -fsS -X POST "$BASE_URL/api/admin/login" -H 'content-type: application/json' --data "$(jq -n --arg password "$ADMIN_PASSWORD" '{password:$password}')")"
          TOKEN="$(printf '%s' "$LOGIN_JSON" | jq -er '.token')"
          for endpoint in content catalog media leads; do
            curl -fsS "$BASE_URL/api/admin/$endpoint" -H "Authorization: Bearer $TOKEN" | jq -e 'type == "object"' >/dev/null
          done
          curl -fsS "$BASE_URL/admin/" | grep -q 'Панель владельца'
          echo "Live API, 317 catalog entries, admin login, protected endpoints and admin page: OK"
