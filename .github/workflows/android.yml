name: Android APK
on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle*"
      - "build.gradle*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download custom launcher icon
        run: |
          curl -fL --retry 3 --retry-delay 2 "https://i.postimg.cc/dtT3knqx/file-00000000fca881f4ab3f0e989999051d.png" -o app/src/main/res/drawable/ic_launcher_custom.png
          test -s app/src/main/res/drawable/ic_launcher_custom.png
      - name: Build installable APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Smeta-Pro.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Smeta-Pro-APK
          path: app/build/outputs/apk/debug/Smeta-Pro.apk
          if-no-files-found: error
          retention-days: 14
