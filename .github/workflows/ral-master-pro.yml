name: RAL MASTER PRO APK
on:
  push:
    branches: [ ral-master-pro ]
    paths:
      - 'ral-master-pro/**'
      - '.github/workflows/ral-master-pro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ral-master-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RAL-MASTER-PRO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RAL-MASTER-PRO-APK
          path: ral-master-pro/app/build/outputs/apk/debug/RAL-MASTER-PRO.apk
          if-no-files-found: error
          retention-days: 14
