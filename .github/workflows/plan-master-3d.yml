name: PLAN MASTER 3D APK
# Build and test the Android app, then publish the installable APK artifact.
on:
  push:
    branches: [ plan-master-3d ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plan-master-3d-ci
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build PLAN MASTER 3D APK and run unit tests
        working-directory: plan-master-3d
        run: |
          gradle testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PLAN-MASTER-3D.apk
      - name: Upload APK independently of emulator QA
        uses: actions/upload-artifact@v4
        with:
          name: PLAN-MASTER-3D-APK
          path: plan-master-3d/app/build/outputs/apk/debug/PLAN-MASTER-3D.apk
          retention-days: 14
