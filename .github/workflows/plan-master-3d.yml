name: PLAN MASTER 3D APK
# CI verifies geometry-driven estimates, builds the APK, runs unit tests, and uses an Android emulator to generate and open multi-page technical/proposal PDFs with dense long-text data, pagination, plans, axonometric pages, construction records, engineering points, and material tables. The emulator exports both PDFs as reviewable artifacts.
on:
  push:
    branches: [ plan-master-3d ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plan-master-3d-ci
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build PLAN MASTER 3D APK and run unit tests
        working-directory: plan-master-3d
        run: |
          gradle testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PLAN-MASTER-3D.apk
      - name: Generate and validate PDF reports on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 1200
          script: |
            cd plan-master-3d
            gradle connectedDebugAndroidTest --info
            RESULTS_DIR="app/build/outputs/androidTest-results/connected/debug"
            echo "Checking that Android instrumentation tests actually executed..."
            find "$RESULTS_DIR" -type f -name '*.xml' -print
            if ! grep -R -E 'tests="[1-9][0-9]*"' "$RESULTS_DIR" --include='*.xml'; then
              echo "ERROR: No executed Android instrumentation tests were found."
              exit 1
            fi
            mkdir -p pdf-artifacts
            adb exec-out run-as ru.planmaster3d.app cat files/PLAN-MASTER-3D-technical-test.pdf > pdf-artifacts/PLAN-MASTER-3D-technical-test.pdf
            adb exec-out run-as ru.planmaster3d.app cat files/PLAN-MASTER-3D-proposal-test.pdf > pdf-artifacts/PLAN-MASTER-3D-proposal-test.pdf
            for pdf in pdf-artifacts/*.pdf; do
              test -s "$pdf"
              test "$(head -c 5 "$pdf")" = "%PDF-"
              test "$(wc -c < "$pdf")" -gt 5000
              echo "Validated $pdf ($(wc -c < "$pdf") bytes)"
            done
      - uses: actions/upload-artifact@v4
        with:
          name: PLAN-MASTER-3D-PDF-QA
          path: plan-master-3d/pdf-artifacts/*.pdf
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: PLAN-MASTER-3D-APK
          path: plan-master-3d/app/build/outputs/apk/debug/PLAN-MASTER-3D.apk
          retention-days: 14
