name: PLAN MASTER 3D APK
# Build the APK independently, then run emulator-based PDF instrumentation QA.
on:
  push:
    branches: [ plan-master-3d ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plan-master-3d-ci
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build PLAN MASTER 3D APK and run unit tests
        working-directory: plan-master-3d
        run: |
          gradle testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PLAN-MASTER-3D.apk
      - name: Upload APK independently of emulator QA
        uses: actions/upload-artifact@v4
        with:
          name: PLAN-MASTER-3D-APK
          path: plan-master-3d/app/build/outputs/apk/debug/PLAN-MASTER-3D.apk
          retention-days: 14
      - name: Generate and validate PDF reports on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 1200
          script: bash .github/scripts/plan-master-3d-pdf-qa.sh
      - name: Upload validated PDF reports
        uses: actions/upload-artifact@v4
        with:
          name: PLAN-MASTER-3D-PDF-QA
          path: plan-master-3d/pdf-artifacts/*.pdf
          retention-days: 14
