name: Deploy RemontMaster production
# Production site and its admin panel are published from the same validated source.
# Publish the connected admin build: save commits data to remont-master-admin-git and then dispatches this workflow.

on:
  push:
    branches:
      - main
      - remont-master-pages
    paths:
      - ".github/workflows/deploy-remont-master-pages.yml"
      - "remont-master-site/admin/ADMIN-GUIDE.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  register-workflow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Register workflow_dispatch on default branch
        run: echo "Workflow dispatch is registered. Production deployments run from remont-master-pages."

  deploy:
    if: github.ref == 'refs/heads/remont-master-pages'
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration and rollback source
        uses: actions/checkout@v4
        with:
          ref: remont-master-pages
          path: current-source/

      - name: Checkout live RemontMaster source and admin
        uses: actions/checkout@v4
        with:
          ref: remont-master-admin-git
          path: site-source/

      - name: Checkout existing root site
        uses: actions/checkout@v4
        with:
          ref: telegram-mini-app
          path: existing-site/

      - name: Assemble production site (single source, no preview copy)
        run: |
          mkdir -p public/remont-master
          cp existing-site/index.html public/index.html
          cp -R site-source/remont-master-site/. public/remont-master/

      - name: Measure published Pages output
        run: |
          python - <<'PY'
          import os, json, datetime
          root = "public"
          def total_bytes():
              return sum(os.path.getsize(os.path.join(base, name)) for base, _, names in os.walk(root) for name in names)
          target = "public/remont-master/data/build-metrics.json"
          metrics = {"generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(), "pagesPublishedBytes": 0, "pagesLimitBytes": 1073741824}
          os.makedirs(os.path.dirname(target), exist_ok=True)
          for _ in range(3):
              with open(target, "w", encoding="utf-8") as f:
                  json.dump(metrics, f, ensure_ascii=False, indent=2)
              metrics["pagesPublishedBytes"] = total_bytes()
          with open(target, "w", encoding="utf-8") as f:
              json.dump(metrics, f, ensure_ascii=False, indent=2)
          print("Pages published bytes:", total_bytes())
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Wait for Pages artifact registration
        run: sleep 8

      - name: Deploy RemontMaster production site
        id: deployment
        uses: actions/deploy-pages@v4
