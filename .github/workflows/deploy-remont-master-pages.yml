name: Deploy RemontMaster to GitHub Pages

on:
  push:
    branches:
      - remont-master-pages
    paths:
      - "remont-master-site/**"
      - ".github/workflows/deploy-remont-master-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RemontMaster source
        uses: actions/checkout@v4
        with:
          ref: remont-master-pages
          path: remont-source

      - name: Checkout current published site
        uses: actions/checkout@v4
        with:
          ref: telegram-mini-app
          path: existing-site

      - name: Assemble website
        run: |
          mkdir -p public/remont-master
          cp existing-site/index.html public/index.html
          cp remont-source/remont-master-site/index.html public/remont-master/index.html
          cp remont-source/remont-master-site/work-catalog.js public/remont-master/work-catalog.js
          cp -R remont-source/remont-master-site/assets public/remont-master/assets

      - name: Prepare local PDF library and embedded fonts
        run: |
          mkdir -p /tmp/remont-pdfmake
          cd /tmp/remont-pdfmake
          npm pack pdfmake@0.2.20 --silent
          tar -xzf pdfmake-0.2.20.tgz
          mkdir -p "$GITHUB_WORKSPACE/public/remont-master/vendor"
          cp package/build/pdfmake.min.js "$GITHUB_WORKSPACE/public/remont-master/vendor/pdfmake.min.js"
          cp package/build/vfs_fonts.js "$GITHUB_WORKSPACE/public/remont-master/vendor/vfs_fonts.js"
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const source = fs.readFileSync('package/build/vfs_fonts.js', 'utf8');
          const required = ['Roboto-Regular.ttf', 'Roboto-Medium.ttf', 'Roboto-Italic.ttf', 'Roboto-MediumItalic.ttf'];
          let registered = null;
          const window = { pdfMake: { addVirtualFileSystem(vfs) { registered = vfs; } } };
          vm.runInNewContext(source, { window });
          const keys = registered ? Object.keys(registered) : [];
          const missing = required.filter(name => !keys.some(key => key.toLowerCase() === name.toLowerCase()));
          if (!registered || missing.length) {
            console.error('pdfMake VFS registration failed; missing fonts:', missing.join(', ') || 'VFS was not registered');
            process.exit(1);
          }
          console.log('Verified pdfMake addVirtualFileSystem registration and embedded Roboto fonts:', required.join(', '));
          NODE
          test -s "$GITHUB_WORKSPACE/public/remont-master/vendor/pdfmake.min.js"
          test -s "$GITHUB_WORKSPACE/public/remont-master/vendor/vfs_fonts.js"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


