name: Deploy RemontMaster production

on:
  push:
    branches:
      - remont-master-pages
    paths:
      - ".github/workflows/deploy-remont-master-pages.yml"
      - "remont-master-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/remont-master-pages'
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the single shared source branch
        uses: actions/checkout@v4
        with:
          ref: remont-master-pages

      - name: Assemble production from the same branch as the admin
        shell: bash
        run: |
          mkdir -p public/remont-master
          cp -R remont-master-site/. public/remont-master/
          printf '%s\n' '<!doctype html>' '<html lang="ru">' '<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./remont-master/"><title>РемонтМастер</title></head>' '<body><p><a href="./remont-master/">Открыть сайт РемонтМастер</a></p></body></html>' > public/index.html

      - name: Resolve redirected video links for embedded playback
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          root = "public/remont-master/data"
          known_hosts = {
              "rutube.ru", "youtube.com", "youtube-nocookie.com", "youtu.be",
              "vk.com", "vkvideo.ru", "ok.ru", "vimeo.com", "player.vimeo.com",
              "dzen.ru", "tiktok.com", "twitch.tv"
          }

          # Diagnostic probe for the short-link format reported by the site owner.
          probe = "https://r2be.ru/HDGtRzV/?r=a"
          try:
              request = Request(probe, headers={"User-Agent": "Mozilla/5.0 RemontMasterPages/1.0"})
              with urlopen(request, timeout=20) as response:
                  print("R2BE redirect test:", response.geturl())
          except Exception as error:
              print("R2BE redirect test unavailable:", error)

          for filename in ("portfolio.json", "diy-media.json"):
              path = os.path.join(root, filename)
              if not os.path.isfile(path):
                  continue
              with open(path, "r", encoding="utf-8") as stream:
                  data = json.load(stream)
              changed = False
              for item in data.get("items", []):
                  if item.get("type") != "video" or not isinstance(item.get("url"), str):
                      continue
                  original = item["url"].strip()
                  parsed = urlparse(original)
                  if parsed.scheme not in ("http", "https") or not parsed.hostname:
                      continue
                  host = parsed.hostname.lower().removeprefix("www.").removeprefix("m.")
                  if host in known_hosts:
                      continue
                  try:
                      request = Request(original, headers={"User-Agent": "Mozilla/5.0 RemontMasterPages/1.0"})
                      with urlopen(request, timeout=20) as response:
                          final_url = response.geturl()
                      final = urlparse(final_url)
                      if final.scheme in ("http", "https") and final.hostname and final_url != original:
                          item["url"] = final_url
                          changed = True
                          print(f"Resolved video link: {host} -> {final.hostname} ({item.get('title', 'без названия')})")
                  except Exception as error:
                      print(f"Could not resolve {original}: {error}")
              if changed:
                  with open(path, "w", encoding="utf-8") as stream:
                      json.dump(data, stream, ensure_ascii=False, indent=2)
                  print("Updated published copy:", filename)
          PY

      - name: Measure Pages output
        shell: bash
        run: |
          python - <<'PY'
          import os, json, datetime
          root = "public"
          target = "public/remont-master/data/build-metrics.json"
          def total_bytes():
              return sum(os.path.getsize(os.path.join(base, name)) for base, _, names in os.walk(root) for name in names)
          metrics = {"generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(), "pagesPublishedBytes": 0, "pagesLimitBytes": 1073741824}
          os.makedirs(os.path.dirname(target), exist_ok=True)
          for _ in range(3):
              with open(target, "w", encoding="utf-8") as f:
                  json.dump(metrics, f, ensure_ascii=False, indent=2)
              metrics["pagesPublishedBytes"] = total_bytes()
          with open(target, "w", encoding="utf-8") as f:
              json.dump(metrics, f, ensure_ascii=False, indent=2)
          print("Pages published bytes:", total_bytes())
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Wait for Pages artifact registration
        shell: bash
        run: sleep 15

      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
