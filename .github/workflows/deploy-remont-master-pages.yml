name: Deploy RemontMaster production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-remont-master-pages.yml"
      - "remont-master-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the single source of truth
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble RemontMaster from main
        run: |
          mkdir -p public/remont-master
          cp -R remont-master-site/. public/remont-master/
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=./remont-master/">
            <title>РемонтМастер</title>
          </head>
          <body>
            <p><a href="./remont-master/">Открыть сайт РемонтМастер</a></p>
          </body>
          </html>
          HTML

      - name: Measure published Pages output
        run: |
          python - <<'PY'
          import os, json, datetime
          root = "public"
          target = "public/remont-master/data/build-metrics.json"
          def total_bytes():
              return sum(os.path.getsize(os.path.join(base, name)) for base, _, names in os.walk(root) for name in names)
          metrics = {"generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(), "pagesPublishedBytes": 0, "pagesLimitBytes": 1073741824}
          os.makedirs(os.path.dirname(target), exist_ok=True)
          for _ in range(3):
              with open(target, "w", encoding="utf-8") as f:
                  json.dump(metrics, f, ensure_ascii=False, indent=2)
              metrics["pagesPublishedBytes"] = total_bytes()
          with open(target, "w", encoding="utf-8") as f:
              json.dump(metrics, f, ensure_ascii=False, indent=2)
          print("Pages published bytes:", total_bytes())
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Wait for Pages artifact registration
        run: sleep 8

      - name: Deploy RemontMaster production site
        id: deployment
        uses: actions/deploy-pages@v4
