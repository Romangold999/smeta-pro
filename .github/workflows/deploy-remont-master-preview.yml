name: Deploy RemontMaster isolated preview
# The preview always takes the latest working branch; production stays pinned.
# Refresh preview after contextual in-place admin editor and media-manager updates.
# Republish after fixing the modal activation and nested edit controls (845317d).
# Include editable content for the materials screen.

on:
  push:
    branches:
      - remont-master-pages
    paths:
      - ".github/workflows/deploy-remont-master-preview.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact currently published production source
        uses: actions/checkout@v4
        with:
          ref: 5d1758a273494b454cb89b474d9b554423d06402
          path: production-source/

      - name: Checkout the exact current root app source
        uses: actions/checkout@v4
        with:
          ref: d2054b7e77a1d641659a806f580df46639867325
          path: existing-site/

      - name: Checkout latest RemontMaster working branch
        uses: actions/checkout@v4
        with:
          ref: remont-master-admin-git
          path: preview-source/

      - name: Assemble unchanged production and isolated working preview
        run: |
          mkdir -p public/remont-master public/remont-master-preview
          cp existing-site/index.html public/index.html
          cp -R production-source/remont-master-site/. public/remont-master/
          cp -R preview-source/remont-master-site/. public/remont-master-preview/

      - name: Verify isolated admin package
        run: |
          test -f public/remont-master-preview/admin/index.html
          test -f public/remont-master-preview/admin/inline-admin.js
          test -f public/remont-master-preview/data/catalog.json
          node --check public/remont-master-preview/admin/inline-admin.js
          node - <<'NODE'
          const fs = require('fs');
          const root = 'public/remont-master-preview/';
          const html = fs.readFileSync(root + 'admin/index.html', 'utf8');
          if (!html.includes('src="admin/inline-admin.js"')) throw new Error('Admin script is not connected');
          if (html.includes('src="admin.js"')) throw new Error('Legacy admin script is still connected');
          const catalog = JSON.parse(fs.readFileSync(root + 'data/catalog.json', 'utf8'));
          const fields = ['id','category','name','unit','price'];
          if (!Array.isArray(catalog.items) || catalog.items.length !== 317) throw new Error('Expected 317 catalog positions');
          if (catalog.items.some(item => fields.some(field => !(field in item)))) throw new Error('Catalog entry is missing a required field');
          if (new Set(catalog.items.map(item => String(item.id))).size !== 317) throw new Error('Catalog IDs are not unique');
          console.log('Admin package verified; 317 catalog records retained.');
          NODE

      - name: Measure both Pages routes
        run: |
          python - <<'PY'
          import os, json, datetime
          root = "public"
          metrics_paths = [
              "public/remont-master/data/build-metrics.json",
              "public/remont-master-preview/data/build-metrics.json",
          ]
          def total_bytes():
              return sum(os.path.getsize(os.path.join(base, name)) for base, _, names in os.walk(root) for name in names)
          metrics = {"generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(), "pagesPublishedBytes": 0, "pagesLimitBytes": 1073741824}
          for path in metrics_paths:
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(metrics, f, ensure_ascii=False, indent=2)
          for _ in range(3):
              metrics["pagesPublishedBytes"] = total_bytes()
              for path in metrics_paths:
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(metrics, f, ensure_ascii=False, indent=2)
          print("Pages published bytes:", total_bytes())
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Wait for Pages artifact registration
        run: sleep 8

      - name: Deploy isolated preview while retaining production files unchanged
        id: deployment
        uses: actions/deploy-pages@v4
