name: Deploy RemontMaster isolated preview

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact currently published production source
        uses: actions/checkout@v4
        with:
          ref: 5d1758a273494b454cb89b474d9b554423d06402
          path: production-source/

      - name: Checkout the exact current root app source
        uses: actions/checkout@v4
        with:
          ref: d2054b7e77a1d641659a806f580df46639867325
          path: existing-site/

      - name: Checkout latest RemontMaster working branch
        uses: actions/checkout@v4
        with:
          ref: remont-master-admin-git
          path: preview-source/

      - name: Assemble unchanged production and isolated working preview
        run: |
          mkdir -p public/remont-master public/remont-master-preview
          cp existing-site/index.html public/index.html
          cp -R production-source/remont-master-site/. public/remont-master/
          cp -R preview-source/remont-master-site/. public/remont-master-preview/

      - name: Measure both Pages routes
        run: |
          python - <<'PY'
          import os, json, datetime
          root = "public"
          metrics_paths = [
              "public/remont-master/data/build-metrics.json",
              "public/remont-master-preview/data/build-metrics.json",
          ]
          def total_bytes():
              return sum(os.path.getsize(os.path.join(base, name)) for base, _, names in os.walk(root) for name in names)
          metrics = {"generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(), "pagesPublishedBytes": 0, "pagesLimitBytes": 1073741824}
          for path in metrics_paths:
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(metrics, f, ensure_ascii=False, indent=2)
          for _ in range(3):
              metrics["pagesPublishedBytes"] = total_bytes()
              for path in metrics_paths:
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(metrics, f, ensure_ascii=False, indent=2)
          print("Pages published bytes:", total_bytes())
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Wait for Pages artifact registration
        run: sleep 8

      - name: Deploy isolated preview while retaining production files unchanged
        id: deployment
        uses: actions/deploy-pages@v4
