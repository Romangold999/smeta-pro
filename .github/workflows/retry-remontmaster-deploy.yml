name: Retry failed RemontMaster publication

on:
  workflow_run:
    workflows:
      - Deploy RemontMaster production
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'remont-master-pages' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait before retrying GitHub Pages
        shell: bash
        run: sleep 20

      - name: Automatically retry failed publication
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.info(`Retrying RemontMaster publication: run ${run.id}, attempt ${run.run_attempt + 1} of 3`);
            await github.request(
              'POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              }
            );
